name = "test-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			# D1 binding name; do not change
database_name = "test-email"		# D1 database name
database_id = "e65f099d-796d-4eaa-8dff-529b368b20db"		# D1 database id

[[kv_namespaces]]
binding = "kv"			# KV binding name; do not change
id = "9be10cd058e04c55b526f8c0c116f50c"					# KV namespace id

#(optional)
#[[r2_buckets]]
#binding = "r2"			# R2 binding name; do not change
#bucket_name = "test-email"		# R2 bucket name

[triggers]
crons = ["0 * * * *"]	# Hourly cron; resetDaySendCount only runs at UTC 0

[[durable_objects.bindings]]
name = "ws"
class_name = "MailHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailHub"]


[vars]
ai_model = ""			# AI model; defaults to @cf/meta/llama-3.1-8b-instruct-fast
analysis_cache = false			# Enable analytics cache
orm_log = false			# SQL logging
domain = ["example.com"]				# Mail domains; multiple allowed, e.g. ["example1.com","example2.com"]
# Auth secrets are intentionally not defined in test configuration.
